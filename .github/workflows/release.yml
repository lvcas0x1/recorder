# On a push to main that changes the app or how it is packaged: run the tests, build the app for
# Apple Silicon, package it as a DMG, and publish it as a GitHub release tagged v<version>.
# Only the newest release is kept.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Scripts/build-app.sh'
      - 'Scripts/make-dmg.sh'
      - 'Scripts/next-version.sh'
      - 'Scripts/make-appcast.sh'
      - 'Scripts/licenses/**'
      - 'Scripts/Info.plist'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The app needs the macOS 27 SDK and the tests need a macOS 27 host. `xcode-27` (macOS 27, Xcode 27)
    # is in public preview: https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write  # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Scripts/build-app.sh defaults to /Applications/Xcode.app; use the runner's selected Xcode instead.
      - name: Toolchain
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      # Next version: Info.plist's major.minor, and a patch one above the highest released patch for
      # that major.minor (at least Info.plist's patch). The first release is Info.plist's version.
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./Scripts/next-version.sh "$(gh release list --limit 1000 --json tagName --jq '.[].tagName')" >> "$GITHUB_OUTPUT"

      # The "Recorder Code Signing" self-signed identity (the same one used for local builds) goes into
      # a temporary keychain, so every release keeps the same designated requirement.
      - name: Import signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          [[ -n "$SIGNING_CERTIFICATE_P12" ]] || { echo "::error::secret SIGNING_CERTIFICATE_P12 is not set"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          print -rn -- "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" ${(f)"$(security list-keychains -d user | tr -d '" ')"}
          security find-identity -p codesigning "$keychain" | grep -q '"Recorder Code Signing"' \
            || { echo "::error::identity 'Recorder Code Signing' not found in the certificate"; exit 1; }
        shell: zsh {0}

      - name: Build app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/build-app.sh

      - name: Build DMG
        run: ./Scripts/make-dmg.sh "${{ steps.version.outputs.version }}"

      # Sparkle's sign_update signs the DMG with the EdDSA key; the app checks it against
      # SUPublicEDKey before installing an update.
      - name: Build appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          [[ -n "$SPARKLE_ED_PRIVATE_KEY" ]] || { echo "::error::secret SPARKLE_ED_PRIVATE_KEY is not set"; exit 1; }
          sparkle="$RUNNER_TEMP/sparkle"
          mkdir -p "$sparkle"
          curl -fsSL --retry 3 --retry-all-errors -o "$sparkle/sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  $sparkle/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf "$sparkle/sparkle.tar.xz" -C "$sparkle" ./bin/sign_update
          SIGN_UPDATE="$sparkle/bin/sign_update" ./Scripts/make-appcast.sh "$VERSION" "$BUILD_NUMBER" \
            "build/Recorder-$VERSION.dmg" "https://github.com/lvcas0x1/recorder/releases/download/v$VERSION/Recorder-$VERSION.dmg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "build/Recorder-$VERSION.dmg" build/appcast.xml \
            --target "$GITHUB_SHA" \
            --title "Recorder $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. Apple Silicon, macOS 27 or later.

          The app is signed with a self-signed certificate and not notarized. After copying it to
          Applications for the first time, open it once, then allow it in System Settings > Privacy &
          Security > Open Anyway. Later versions install through the menu-bar menu (Update) and keep the
          Screen Recording and Microphone permissions."

      # Keep only the newest release; delete older ones together with their tags.
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:][] | .tagName' |
          while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done
